# --------------------------------------------------
# Dependabot configuration file.
#
# Dependabot opens pull requests to keep dependencies up to date
# automatically. It supports a wide range of package ecosystems and
# can be configured to group updates, set schedules, and apply labels.
#
# Minor and patch releases are grouped together to reduce PR noise.
# Major releases are left as individual pull requests for explicit review.
#
# For more information please see:
# https://docs.github.com/en/code-security/dependabot
# --------------------------------------------------

# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  # --------------------------------------------------
  # Docker dependency updates
  # --------------------------------------------------

  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 8

  # --------------------------------------------------
  # DevContainer dependency updates
  # --------------------------------------------------

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 8
    groups:
      devcontainer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --------------------------------------------------
  # GitHub Actions workflow updates
  # --------------------------------------------------

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 8
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --------------------------------------------------
  # Node.js dependency updates.
  # Minor and patch updates are grouped to reduce PR noise.
  # Major updates are left as individual pull requests.
  # --------------------------------------------------

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 7
      semver-minor-days: 6
      semver-major-days: 8
    groups:
      npm-deps-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-deps-dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  # TODO: Add additional package ecosystems as needed
